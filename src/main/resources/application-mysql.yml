spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:3306/${DB_NAME:starterdb}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
