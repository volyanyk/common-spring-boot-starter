# Testcontainers configuration for Docker Desktop on macOS
# This ensures Testcontainers can properly detect and connect to Docker

# Specify the Docker host socket path for macOS Docker Desktop
docker.host=unix:///Users/ov/.docker/run/docker.sock

# Disable Ryuk container (optional, but can help with cleanup issues)
testcontainers.reuse.enable=false

# Checks disabled to speed up tests (optional)
checks.disable=false
